# docker-compose.yml
version: '3.8'

services:
  reveng:
    build: .
    container_name: reveng-workspace
    volumes:
      - ./workspace:/workspace
      - ./challenges:/challenges:ro
    stdin_open: true
    tty: true
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_PTRACE
    environment:
      - DISPLAY=${DISPLAY}
    network_mode: host
